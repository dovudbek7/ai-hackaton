{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  <li>
    <form action="import-excel/" method="post" enctype="multipart/form-data" style="display:inline-flex; gap:8px; align-items:center;">
      {% csrf_token %}
      <input type="file" name="file" accept=".xlsx,.xls" required>
      <button type="submit" class="button">Import Excel</button>
    </form>
  </li>
  <li>
    <form action="import-json/" method="post" enctype="multipart/form-data" style="display:inline-flex; gap:8px; align-items:center;">
      {% csrf_token %}
      <input type="file" name="file" accept=".json" required>
      <button type="submit" class="button">Import JSON</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
